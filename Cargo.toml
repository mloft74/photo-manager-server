[package]
name = "photo_manager_server"
version = "0.3.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-trait = "0.1.92"
auto_impl = "1.4.0"
axum = { version = "0.8.9", features = ["http2", "macros", "multipart", "ws"] }
dotenvy = "0.15.7"
futures = "0.3.34"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "http2", "server"] }
image = "0.25.10"
rand = "0.10.3"
sea-orm = { version = "2.0.4", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
sea-orm-migration ={ version = "2.0.4", features = ["sqlx-postgres", "runtime-tokio-rustls"] } 
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower-http = { version = "0.7.1", features = ["fs", "limit", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
