services:
  photo_manager_server:
    build: .
    restart: always
    ports:
      - '3000:3000'
    volumes:
      - /var/lib/photo_manager_server:/var/lib/photo_manager_server
    depends_on:
      - db
    networks:
      - photo_manager_net
  db:
    image: postgres:18.6-alpine3.24
    restart: always
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=root
    ports:
      - '5432:5432'
    volumes:
      - db:/var/lib/postgresql
      - ./sql/create_database.sql:/docker-entrypoint-initdb.d/create_database.sql
    networks:
      - photo_manager_net
  pgadmin:
    image: dpage/pgadmin4:9.19
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "5050:80"
    volumes:
      - pgadmin:/var/lib/pgadmin
    depends_on:
      - db
    networks:
      - photo_manager_net
volumes:
  db:
    driver: local
  pgadmin:
    driver: local
networks:
  photo_manager_net:
    driver: bridge
    driver_opts:
      "com.docker.network.bridge.name": "photomanagernet"
